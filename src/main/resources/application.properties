# ---- MySQL Database ----
# Create the database first: CREATE DATABASE orc_waste_heat_db;
# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/orc_waste_heat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=SANTHANALAKSHMI1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update will create/alter the tables automatically on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
server.port=8080

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Application info ----
spring.application.name=orc-wasteheat-monitoring
